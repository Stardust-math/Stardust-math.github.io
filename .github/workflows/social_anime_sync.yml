name: Social Anime sync

on:
  workflow_run:
    workflows:
      - Generate index pages
    types:
      - completed

  schedule:
    - cron: "17 19 * * 0"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-anime-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.actor.login != 'github-actions[bot]'
      )
    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:
      - name: Checkout current main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Select synchronization mode
        id: sync_mode
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            echo "mode=dynamic" >> "$GITHUB_OUTPUT"
            echo "commit_message=chore(anime): sync dynamic Bangumi data" >> "$GITHUB_OUTPUT"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "commit_message=chore(anime): sync full Bangumi data" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize Bangumi data
        env:
          BANGUMI_ACCESS_TOKEN: ${{ secrets.BANGUMI_ACCESS_TOKEN }}
          SYNC_MODE: ${{ steps.sync_mode.outputs.mode }}
        shell: bash
        run: |
          case "$SYNC_MODE" in
            dynamic)
              node scripts/update_social_anime_dynamic.js
              ;;
            full)
              node scripts/update_social_anime.js
              ;;
            *)
              echo "::error::Unknown Anime synchronization mode: $SYNC_MODE"
              exit 1
              ;;
          esac

      - name: Check Anime data and generated files
        run: node scripts/check_social_anime.js

      - name: Verify synchronization output scope
        shell: bash
        run: |
          mapfile -t changed_paths < <(
            {
              git diff --name-only
              git ls-files --others --exclude-standard
            } | sort -u
          )

          unexpected=0
          for path in "${changed_paths[@]}"; do
            case "$path" in
              assets/data/social/anime/items/bgm-*.json|\
              assets/data/social/anime/anime-index.json|\
              assets/data/social/anime/CATALOG.md|\
              assets/images/social/anime/fallback/bgm-*)
                ;;
              *)
                echo "::error file=${path}::Unexpected Anime synchronization output."
                unexpected=1
                ;;
            esac
          done

          if (( unexpected != 0 )); then
            echo "Anime synchronization produced files outside the allowed scope."
            exit 1
          fi

      - name: Commit synchronized Anime files
        env:
          COMMIT_MESSAGE: ${{ steps.sync_mode.outputs.commit_message }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- \
            ':(glob)assets/data/social/anime/items/bgm-*.json' \
            assets/data/social/anime/anime-index.json \
            assets/data/social/anime/CATALOG.md \
            ':(glob)assets/images/social/anime/fallback/bgm-*'

          if git diff --cached --quiet; then
            echo "No Anime synchronization changes."
            exit 0
          fi

          git commit -m "$COMMIT_MESSAGE"
          git pull --rebase origin main
          git push origin HEAD:main
