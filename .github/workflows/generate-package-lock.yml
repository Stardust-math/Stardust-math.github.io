name: Generate package lock

on:
  push:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/generate-package-lock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-auto-commit
  cancel-in-progress: false

jobs:
  generate-package-lock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate package-lock.json
        run: npm install --package-lock-only

      - name: Commit package-lock.json
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No package-lock.json changes."
            exit 0
          fi

          git status --short

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package-lock.json

          if git diff --cached --quiet; then
            echo "No package-lock.json changes after staging."
            exit 0
          fi

          git commit -m "chore(npm): update package lock"

          git pull --rebase origin main
          git push