name: Font resource check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check_fonts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install

      - name: Compile SCSS to CSS
        run: npm run build:css

      - name: Check font resources
        run: node scripts/check_fonts.js