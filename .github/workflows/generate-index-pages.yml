name: Generate index pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-auto-commit
  cancel-in-progress: false

jobs:
  generate-index-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Ensure local main branch
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate index pages
        run: node scripts/generate_index_pages.js

      - name: Commit generated index pages
        run: |
          has_tracked_changes=false
          has_untracked_changes=false

          if ! git diff --quiet; then
            has_tracked_changes=true
          fi

          if [ -n "$(git ls-files --others --exclude-standard)" ]; then
            has_untracked_changes=true
          fi

          if [ "$has_tracked_changes" = false ] && [ "$has_untracked_changes" = false ]; then
            echo "No generated index page changes."
            exit 0
          fi

          git status --short

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No generated index page changes after staging."
            exit 0
          fi

          git commit -m "chore(index): regenerate index pages"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}..."

            if git push origin HEAD:main; then
              echo "Generated index pages pushed successfully."
              exit 0
            fi

            echo "Push failed. Rebasing onto latest origin/main..."
            git fetch origin main
            git rebase origin/main
          done

          echo "Failed to push generated index pages after 3 attempts."
          exit 1