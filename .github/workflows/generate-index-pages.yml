name: Generate index pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: stardust-main-writer
  queue: max

jobs:
  generate-index-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate index pages
        run: node scripts/generate_index_pages.js

      - name: Verify generated site
        run: |
          node scripts/generate_index_pages.js --check
          node scripts/check_site_resources.js

      - name: Commit generated index pages
        id: commit_generated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- ':(glob)**/index.html'

          if git diff --cached --quiet; then
            echo "No generated index page changes."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git status --short -- ':(glob)**/index.html'
          git commit -m "chore(index): regenerate index pages"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Request GitHub Pages build
        if: steps.commit_generated.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${{ github.repository }}/pages/builds"
