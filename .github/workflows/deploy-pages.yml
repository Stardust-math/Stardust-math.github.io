name: Deploy GitHub Pages with SCSS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Generate index pages in workspace
        run: node scripts/generate_index_pages.js

      - name: Compile SCSS to CSS
        run: npm run build:css

      - name: Verify generated CSS
        run: |
          test -f assets/css/fonts.css
          test -f assets/css/base/site-zoom.css
          test -f assets/css/about/about.css
          test -f assets/css/components/site-footer-label.css
          find assets/css -type f -name "*.css" | sort

      - name: Check generated index pages
        run: node scripts/generate_index_pages.js --check

      - name: Check configured site resources
        run: node scripts/check_site_resources.js

      - name: Check SCSS output coverage
        run: npm run check:css

      - name: Build static Pages directory
        run: npm run build:pages

      - name: Check Pages artifact contents
        run: npm run check:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4