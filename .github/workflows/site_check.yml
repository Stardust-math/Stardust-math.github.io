name: Site resource check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  check_site_resources:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install

      - name: Compile SCSS to CSS
        run: npm run build:css

      - name: Check generated index pages
        run: node scripts/generate_index_pages.js --check

      - name: Check configured site resources
        run: node scripts/check_site_resources.js

      - name: Check SCSS output coverage
        run: npm run check:css